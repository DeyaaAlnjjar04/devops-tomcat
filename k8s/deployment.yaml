apiVersion: apps/v1
kind: Deployment
metadata:
  n
ame: devops-tomcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-tomcat
  template:
    metadata:
      labels:
        app: devops-tomcat
    spec:
      containers:
        - name: tomcat
          image: deyaaalnjjar/devops-tomcat:1.0
          ports:
            - containerPort: 8080
